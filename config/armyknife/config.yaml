# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/armyknife/refs/heads/master/docs/config-schema.json

editor:
  terminal: ghostty

notification:
  enabled: false

agent:
  statuses:
    you:
      state: user
    wait:
      state: waiting
    done:
      state: done
  merge_notification: |
    <delegation-update>
    armyknife による自動送信です。人間や委任先からの依頼ではありません。

    委任先の PR が merge されました。

    - Branch: {branch}
    - PR: {pr_url}

    delegate skill の「委任先の PR が merge された場合」に従ってください。
    </delegation-update>
  stop_hook_instruction: |
    Set your status with `a agent status set <kind> <note>` before stopping.
    During vibe coding (`a agent vibe status` exits 0), use `wait` after sending `<vibe-draft-ready>` or `<vibe-pr-ready>` while waiting for the delegator's response, review, or merge. This rule takes precedence for those waits.
    Use `you` when the next step belongs to the user, including a decision, manual action, answer, diff or design review, or PR merge.
    Use `wait` when waiting for another session, CI, or other external work.
    Use `done` when no work remains.
    For `you` and `wait`, write the note as one noun phrase describing only the user's next action or the party you are waiting for. For `done`, use `next user instruction` as the note.
    Do not mention completed work, history, or use completion wording such as "done".
    Include the repository name whenever you refer to a numbered item. Avoid labels that only make sense inside the current session.
    Examples: "alert method selection (A: webhook addition / B: reminder adjustment)", "secret store registration for a generated token", "merge of sample-repo PR 42", "next user instruction".
    After setting your status, stop immediately without writing a final message or any other text.
  # quota has headroom; losing conversation context hurts more than it saves
  auto_compact:
    enabled: false
  # Glyph names are listed at https://www.nerdfonts.com/cheat-sheet.
  work_types:
    development:
      icon: "\uEAC4" # nf-cod-code
      color: [135, 215, 135] # green (#87D787)
    design:
      icon: "\uEA91" # nf-cod-symbol_structure
      color: [215, 175, 255] # purple (#D7AFFF)
    research:
      icon: "\uEA6D" # nf-cod-search
      color: [95, 175, 215] # blue (#5FAFD7)
    debug-flow:
      icon: "\uEAAF" # nf-cod-bug
      color: [255, 135, 135] # red (#FF8787)
    project-manager:
      icon: "\U000F0849" # nf-md-account_group
      color: [255, 215, 135] # yellow (#FFD787)
  work_type_fallback:
    icon: "\uF141" # nf-fa-ellipsis_h
    color: [135, 135, 135] # gray (#878787)
  vibe_marker:
    icon: "\U000F140B" # nf-md-lightning_bolt
    color: [255, 135, 215] # pink (#FF87D7)
  codex:
    # Applies to delegated sessions only, so interactive `codex` keeps its own
    # defaults. The delegate skill explains why the quota goes to effort rather
    # than to a higher model tier.
    model: gpt-6-luna
    reasoning_effort: max
  worktree:
    layout:
      command: claude

orgs:
  fohte:
    vibe: true

repos:
  fohte/dotfiles:
    # dotfiles is operated directly on the default branch.
    direct_commit: true
  fohte/runok:
    # External contributors require human review before merging.
    vibe: false
  fohte/t-rader:
    language: ja
