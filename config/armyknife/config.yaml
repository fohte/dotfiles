# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/armyknife/refs/heads/master/docs/config-schema.json

editor:
  terminal: ghostty

notification:
  enabled: false

agent:
  bg_task_reminder:
    timeout: 10m
    excluded_commands:
      - 'a gh issue-agent review'
      - 'a gh pr-review reply review'
      - 'a ai pr-draft review'
      - 'a ai draft'
      # Bare `crit` waits for review and cannot be matched more narrowly.
      - crit
  statuses:
    you:
      state: user
    wait:
      state: waiting
    done:
      state: done
  # The fork cannot set status directly, so its criteria must match stop_hook_instruction
  # and Codex developer_instructions.
  status_inference_prompt: |
    直前のやりとりから、次に誰が何をするべきかを判定し、status を選んでください。
    vibe coding 中 (`a agent vibe status` が exit 0) に `<vibe-draft-ready>` か `<vibe-pr-ready>` を送って委任元の返答・レビュー・merge を待つ場合は `wait` を使ってください。この待ちについてはこの規則を優先します。
    次の一手がユーザーにある場合 (判断、手作業、回答、diff や設計のレビュー、PR の merge など) は `you` を使ってください。
    他のセッション、CI、その他の外部作業を待つ場合は `wait` を使ってください。
    残作業がなければ `done` を使ってください。
    `you` と `wait` の note は、ユーザーの次の行動か待ち相手だけを表す英語の名詞句 1 つにしてください。`done` の note は `next user instruction` にしてください。
    note には完了した作業や経緯を書かず、"done" のような完了を表す語も使わないでください。
    番号付きの項目に触れるときはリポジトリ名を含めてください。現在のセッション内でしか通じないラベルは避けてください。
    note の例: "alert method selection (A: webhook addition / B: reminder adjustment)", "secret store registration for a generated token", "merge of sample-repo PR 42", "next user instruction"
    タスクを続けず、status だけを答えてください。
  merge_notification: |
    <delegation-update>
    armyknife による自動送信です。人間や委任先からの依頼ではありません。

    委任先の PR が merge されました。

    - Branch: {branch}
    - PR: {pr_url}

    delegate skill の「委任先の PR が merge された場合」に従ってください。
    </delegation-update>
  # Keep its status criteria aligned with status inference and Codex developer instructions.
  stop_hook_instruction: |
    ターンを終える前に `a agent status set <kind> <note>` で status を設定してください。
    vibe coding 中 (`a agent vibe status` が exit 0) に `<vibe-draft-ready>` か `<vibe-pr-ready>` を送って委任元の返答・レビュー・merge を待つ場合は `wait` を使ってください。この待ちについてはこの規則を優先します。
    次の一手がユーザーにある場合 (判断、手作業、回答、diff や設計のレビュー、PR の merge など) は `you` を使ってください。
    他のセッション、CI、その他の外部作業を待つ場合は `wait` を使ってください。
    残作業がなければ `done` を使ってください。
    `you` と `wait` の note は、ユーザーの次の行動か待ち相手だけを表す英語の名詞句 1 つにしてください。`done` の note は `next user instruction` にしてください。
    note には完了した作業や経緯を書かず、"done" のような完了を表す語も使わないでください。
    番号付きの項目に触れるときはリポジトリ名を含めてください。現在のセッション内でしか通じないラベルは避けてください。
    note の例: "alert method selection (A: webhook addition / B: reminder adjustment)", "secret store registration for a generated token", "merge of sample-repo PR 42", "next user instruction"
    status を設定したら、直前のメッセージを参照する短い 1 行だけを日本語で返して終了してください。そのメッセージを繰り返したり言い換えたりしないでください。
  # quota has headroom; losing conversation context hurts more than it saves
  auto_compact:
    enabled: false
  # Glyph names are listed at https://www.nerdfonts.com/cheat-sheet.
  work_types:
    development:
      icon: "\uEAC4" # nf-cod-code
      color: [135, 215, 135] # green (#87D787)
    design:
      icon: "\uEA91" # nf-cod-symbol_structure
      color: [215, 175, 255] # purple (#D7AFFF)
    research:
      icon: "\uEA6D" # nf-cod-search
      color: [95, 175, 215] # blue (#5FAFD7)
    debug-flow:
      icon: "\uEAAF" # nf-cod-bug
      color: [255, 135, 135] # red (#FF8787)
    project-manager:
      icon: "\U000F0849" # nf-md-account_group
      color: [255, 215, 135] # yellow (#FFD787)
  work_type_fallback:
    icon: "\uF141" # nf-fa-ellipsis_h
    color: [135, 135, 135] # gray (#878787)
  vibe_marker:
    icon: "\U000F140B" # nf-md-lightning_bolt
    color: [255, 135, 215] # pink (#FF87D7)
  active_profile: default
  profiles:
    default:
      handoff:
        engine: claude
        model: opus
        reasoning_effort: xhigh
      delegate:
        engine: codex
        model: gpt-6-luna
        reasoning_effort: max
  # Keep this fallback for `a agent new` calls without `--type`.
  codex:
    # Model and effort fallback for `a agent new` without `--type` when its
    # legacy resolver selects Codex.
    model: gpt-6-luna
    reasoning_effort: max
  # Keep kind-based settings for `a agent new` calls without `--type`.
  launch_profiles:
    design:
      engine: claude
      claude:
        model: opus
      codex:
        model: gpt-6.1-sol
        reasoning_effort: high
  worktree:
    layout:
      command: claude

orgs:
  fohte:
    vibe: true

repos:
  fohte/dotfiles:
    # dotfiles is operated directly on the default branch.
    direct_commit: true
  fohte/runok:
    # External contributors require human review before merging.
    vibe: false
  fohte/t-rader:
    language: ja
