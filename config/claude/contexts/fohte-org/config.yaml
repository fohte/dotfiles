variables:
  remote: git remote get-url origin
  repo_name: git remote get-url origin | sed 's#.*/##; s#\.git$##'
  # Codex spills hook output over 2,500 tokens (bytes / 4, i.e. 10,000 bytes) and
  # keeps only the head and tail, which can drop repo-facts. Cap the note in bytes
  # (Japanese is 3 bytes/char), cutting at a line boundary to keep UTF-8 intact.
  repo_note: |
    repo_name=$(git remote get-url origin | sed 's#.*/##; s#\.git$##') &&
    out=$(obsidian vault=obsidian-v2 read file="$repo_name" 2>/dev/null) && [[ "$out" != Error:* ]] && printf '%s\n' "$out" | sed '/^---$/,/^---$/d' | LC_ALL=C awk -v max=6000 -v name="$repo_name" '
      { n += length($0) + 1 }
      n > max { print "[Truncated. Read the full note with /wiki-local: notes/inbox/" name ".md]"; exit }
      { print }
    ' || true
template: template.md
