# Private-role overlay merged with reviewers.yaml by review-config. Keeps
# language-focused reviews on Antigravity when the shared default changes.

# Use the configured Codex model as the shared default for both review flows.
default_agent: codex

agents:
  # The default high tier spends ~20s per turn on thinking, which puts a
  # file-reading reviewer past agy's print timeout.
  agy:
    model: gemini-3.8-flash-low
  codex:
    model: gpt-6-luna
    reasoning_effort: max

reviewers:
  comment:
    agent: agy
  japanese-writing:
    agent: agy
  # These checks match changes against explicit repository rules and test
  # evidence, so their rule-based reasoning fits the lower-capability Codex model.
  convention:
    agent: codex
  test-philosophy:
    agent: codex
