# Reviewer selection and prompt inputs are data so every backend (Claude
# subagents, Codex, Antigravity, ...) shares one source of truth.
#
# `default_agent` / per-reviewer `agent` name which CLI runs a reviewer
# (`claude` or a key under `agents:`). `definition` names the reviewer
# definition file under ~/.claude/agents/, independent of which agent runs it.
default_agent: claude

reviewers:
  behavior:
    always: true
    definition: self-review-behavior.md
    references:
      - self-review/references/_common.md
      - self-review/references/behavior.md

  structure:
    always: true
    definition: self-review-structure.md
    references:
      - self-review/references/_common.md
      - self-review/references/structure.md

  convention:
    always: true
    definition: self-review-convention.md
    references:
      - self-review/references/_common.md
      - self-review/references/convention.md

  comment:
    trigger:
      kind: added-lines
      # Markers require a following space: without it the pattern also matches
      # CSS hex literals and Ruby string interpolation.
      pattern: '(^|[[:space:]])(//|#|--)[[:space:]]|^[[:space:]]*(\*|/\*)|"""|<!--'
      # `# ` at the start of a line in prose files is a Markdown heading, not
      # a comment marker.
      exclude: '\.(md|mdx|markdown|rst|adoc|txt)$'
    definition: self-review-comment.md
    references:
      - self-review/references/_common.md
      - self-review/references/comment.md

  gha-security:
    trigger:
      kind: paths
      pattern: '^(\.github/workflows/.*\.ya?ml|\.github/actions/.+/action\.ya?ml|action\.ya?ml)$'
    definition: self-review-gha-security.md
    references:
      - gha-security-review/SKILL.md
      - gha-security-review/references/*.md
      - self-review/references/_common.md

  test-philosophy:
    trigger:
      kind: paths
      case_insensitive: true
      pattern: '(^|/)(tests?|__tests__|spec)/|(\.|_)(test|spec|stories)\.[a-zA-Z]+$|_test\.(go|py|rb)$|_spec\.rb$'
    definition: self-review-test-philosophy.md
    references:
      - test-philosophy/SKILL.md
      - self-review/references/_common.md

  db-schema:
    trigger:
      kind: paths
      case_insensitive: true
      pattern: '(^|/)(db|database)/(migrate|migrations|schema)/|(^|/)(migrations?|schema)/.*\.(sql|rb|py|ts|js)$|(^|/)schema\.(rb|sql|prisma)$|(^|/)structure\.sql$|\.(sql|prisma)$'
    definition: self-review-db-schema.md
    references:
      - postgresql-table-design/SKILL.md
      - self-review/references/_common.md

  japanese-writing:
    trigger:
      kind: added-lines
      paths: '\.(md|mdx|markdown|rst|adoc|txt)$'
      pattern: '[ぁ-んァ-ヶ一-龯]'
    definition: self-review-japanese-writing.md
    references:
      - japanese-tech-writing/SKILL.md

  readme:
    trigger:
      kind: paths
      case_insensitive: true
      pattern: '(^|/)README\.(md|mdx|markdown|rst)$|^docs/.+\.(md|mdx|markdown|rst)$'
      exclude: '(^|/)templates?/'
    definition: self-review-readme.md
    references:
      - crafting-effective-readmes/SKILL.md
      - crafting-effective-readmes/references/*.md

  lint-suppression:
    trigger:
      kind: added-lines
      case_insensitive: true
      pattern: 'eslint-disable|@ts-ignore|@ts-expect-error|stylelint-disable|rubocop:(disable|todo)|\bnoqa\b|type:[[:space:]]*ignore|pylint:[[:space:]]*disable|\bnosec\b|//[[:space:]]*nolint|shellcheck disable|ignorePatterns|\bExclude[[:space:]]*:'
      exclude: '^config/claude/(skills/self-review/|agents/self-review-.*\.md$)'
    definition: self-review-lint-suppression.md
    references:
      - self-review/references/_common.md
      - self-review/references/lint-suppression.md
