model = "gpt-5.6-sol"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Both keys below belong to their table, not the top level. A stray top-level
# key parses fine and is silently dropped, so the setting looks applied while
# the default stays in force. `codex exec --strict-config` rejects such keys.
[sandbox_workspace_write]
network_access = true

[tools]
web_search = true

# Subagents inherit the parent's model unless told otherwise, so a Sol parent
# spawns Sol children and a fan-out of three costs more than the parent's own
# turn. Children only explore and hand back a summary, so the cheapest model
# with the deepest effort buys the same answer.
[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[tui]
status_line = ["model-with-reasoning", "used-tokens", "context-used", "five-hour-limit", "weekly-limit", "codex-version"]
status_line_use_colors = true
