model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Disabled so runok can apply its own sandbox; nesting the two fails with
# `sandbox_apply` exit 71. runok only intercepts Bash, so apply_patch writes
# are no longer confined to the workspace.
sandbox_mode = "danger-full-access"

approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Codex is upgraded through Homebrew, so the startup update prompt is noise.
check_for_update_on_startup = false

# Codex-only guidance belongs here because AGENTS.md is shared with Claude Code.
developer_instructions = """
ターンを終える前に `a agent status set <kind> <note>` で status を設定してください。
vibe coding 中 (`a agent vibe status` が exit 0) に `<vibe-draft-ready>` か `<vibe-pr-ready>` を送って委任元の返答・レビュー・merge を待つ場合は `wait` を使ってください。この待ちについてはこの規則を優先します。
次の一手がユーザーにある場合 (判断、手作業、回答、diff や設計のレビュー、PR の merge など) は `you` を使ってください。
他のセッション、CI、その他の外部作業を待つ場合は `wait` を使ってください。
残作業がなければ `done` を使ってください。
`you` と `wait` の note は、ユーザーの次の行動か待ち相手だけを表す英語の名詞句 1 つにしてください。`done` の note は `next user instruction` にしてください。
note には完了した作業や経緯を書かず、"done" のような完了を表す語も使わないでください。
番号付きの項目に触れるときはリポジトリ名を含めてください。現在のセッション内でしか通じないラベルは避けてください。
note の例: "alert method selection (A: webhook addition / B: reminder adjustment)", "secret store registration for a generated token", "merge of sample-repo PR 42", "next user instruction"
"""

[tools]
web_search = true

# Subagents inherit the parent's model unless told otherwise, so a Sol parent
# spawns Sol children and a fan-out of three costs more than the parent's own
# turn. Children only explore and hand back a summary, so the cheapest model
# with the deepest effort buys the same answer.
[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[tui]
status_line = ["model-with-reasoning", "used-tokens", "context-used", "five-hour-limit", "weekly-limit", "codex-version"]
status_line_use_colors = true

# The GitHub connector's tools bypass runok, which only hooks Bash; `gh` covers
# the same ground under runok's rules. This only hides the app from Codex, not
# from ChatGPT.
[apps.connector_76869538009648d5b282a4bb21c3d157]
enabled = false
