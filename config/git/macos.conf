[user]
# This path names the local OpenSSH handle; the non-exportable private key stays in Secure Enclave.
	signingkey = ~/.ssh/id_dotfiles_secure_enclave_signing

[gpg]
	format = ssh

[gpg "ssh"]
	program = ~/ghq/github.com/fohte/dotfiles/config/git/scripts/ssh-sign

# Local overrides for Git signing settings.
[include]
	path = ~/.config/git/signing-override.conf
