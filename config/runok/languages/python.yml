# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/runok/main/schema/runok.schema.json

definitions:
  wrappers:
    # uvx fetches and runs a PyPI CLI. Register as a wrapper so the inner
    # command is evaluated against normal rules. `--from <pkg>` is optional.
    - 'uvx [--from *] <cmd>'

rules:
  # Skill-bundled Python tools may use mkdtemp in $TMPDIR, which readonly rejects.
  - allow: 'python3|python <var:claude-skill-scripts> *'
    when: >-
      size(args) > 0 &&
      (!args[0].startsWith('/') ||
       args[0].startsWith(env.HOME + '/.agents/skills/') ||
       args[0].startsWith(env.HOME + '/.claude/skills/') ||
       args[0].startsWith(env.HOME + '/.claude/plugins/cache/'))
    sandbox: write-tmp-cwd
    tests:
      - allow: 'python3 ~/.agents/skills/example-skill/scripts/check.py run --stdin'
      - allow: 'python3 ~/.claude/skills/example-skill/scripts/check.py verify --final final.md'
      - allow: 'python ~/.agents/skills/example-skill/scripts/check.py run --stdin'
      - allow: 'python3 ~/.claude/skills/example-skill/bin/check.py --help'
      - allow: 'python3 ~/.claude/plugins/cache/example-marketplace/example-plugin/1.0.0/skills/example-skill/scripts/check.py run --stdin'

  # Rule matches do not take priority by order, so exclude the writable calls
  # from the generic Python sandbox explicitly.
  - allow: 'python3|python *'
    when: >-
      !(size(args) > 0 &&
        definitions.vars["claude-skill-scripts"].exists(p, glob_matches(p, args[0])) &&
        (!args[0].startsWith('/') ||
         args[0].startsWith(env.HOME + '/.agents/skills/') ||
         args[0].startsWith(env.HOME + '/.claude/skills/') ||
         args[0].startsWith(env.HOME + '/.claude/plugins/cache/')))
    sandbox: readonly
    tests:
      - allow: 'python3 -c "print(1)"'
      - allow: 'python -c "print(1)"'
      - allow: 'python3 example.py'
      - allow: 'python example.py'
      - allow: 'python3 /Users/example/repo/.claude/skills/example-skill/scripts/check.py run --stdin'

  - allow: 'schemathesis *'
    tests:
      - allow: 'schemathesis run http://localhost:3000/api-docs/openapi.json'
      - allow: 'schemathesis --config-file backend/schemathesis.toml run http://localhost:3000/api-docs/openapi.json --checks all'

  - allow: 'copier copy|update *'
    tests:
      - allow: 'copier update'
      - allow: 'copier update --trust --defaults'
      - allow: 'copier update --vcs-ref=v0.8.2 --trust --defaults --data-file=/tmp/copier-data.yml'
      - allow: 'copier copy --overwrite --defaults --data-file data.yml --trust /tmp/dest .'

  - deny: 'pip|pip3 install *'
    message: 'BLOCKED: Use uvx to run PyPI CLIs without polluting the user/system Python env.'
    fix_suggestion: 'uvx <pkg>'
    tests:
      - deny: 'pip install schemathesis'
      - deny: 'pip install --user schemathesis'
      - deny: 'pip3 install -r requirements.txt'

tests:
  cases:
    - allow: 'uvx ruff --version'
    - allow: 'uvx --from "schemathesis>=4.0,<5.0" schemathesis --version'
    - deny: 'uvx pip install requests'
    - deny: 'uvx --from pip pip install requests'
