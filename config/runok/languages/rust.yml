# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/runok/main/schema/runok.schema.json

rules:
  - allow: 'cargo build *'
    tests:
      - allow: 'cargo build --release'
  - allow: 'cargo check *'
  - allow: 'cargo clean *'
    tests:
      - allow: 'cargo clean'
      - allow: 'cargo clean -p armyknife'
  - allow: 'cargo clippy *'
  - allow: 'cargo doc *'
  - allow: 'cargo fmt *'
  # Writes only Cargo.lock, same blast radius as the already-allowed `cargo update *`.
  - allow: 'cargo generate-lockfile *'
    tests:
      - allow: 'cargo generate-lockfile'
      - allow: 'cargo generate-lockfile --offline'
  # An unknown name makes `cargo help <name>` exec `cargo-<name> --help` from
  # PATH, so the subcommand is pinned to the set already allowed below.
  - allow: 'cargo help build|check|clean|clippy|doc|fmt|generate-lockfile|help|info|llvm-cov|metadata|new|search|test|tree|update'
    tests:
      - allow: 'cargo help build'
      - allow: 'cargo help generate-lockfile'
      - pass: 'cargo help pwntest'
  - allow: 'cargo info *'
    tests:
      - allow: 'cargo info progenitor'
      - allow: 'cargo info serde@1.0'
  - allow: 'cargo llvm-cov *'
  - allow: 'cargo metadata *'
  - allow: 'cargo new *'
    tests:
      - allow: 'cargo new --bin tree-check'
  # `cargo run` is trust-gated; see trusted-repos.yml.
  - allow: 'cargo search *'
  - allow: 'cargo test *'
    tests:
      - allow: 'cargo test'
      - allow: 'cargo test --lib'
  - allow: 'cargo tree *'
  - allow: 'cargo update *'
    tests:
      - allow: 'cargo update --workspace --offline'
      - allow: 'cargo update -p armyknife --offline'

  - allow: 'rustup show *'
    tests:
      - allow: 'rustup show'
      - allow: 'rustup show active-toolchain'
      - allow: 'rustup show home'
