# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/runok/main/schema/runok.schema.json

rules:
  - allow: 'defaults read *'
  - allow: 'pmset -g *'
  - allow: 'log show *'
  - allow: 'mdfind *'
  - allow: 'sw_vers'
  - allow: 'pkgutil --check-signature *'
  - allow: 'launchctl list *'

  # -plist/-p writes attributes to a file; every other flag is a read-only
  # attribute query (see `mdls -h`).
  - allow: 'mdls !-plist|-p *'
    tests:
      - allow: 'mdls -name kMDItemNumberOfPages "/Users/fohte/.claude/projects/x/tool-results/webfetch-1785209917326-d07pwi.pdf"'
      - allow: 'mdls bll1992.pdf'
      - allow: 'mdls -attr kMDItemFSName bll1992.pdf'
      - ask: 'mdls -plist out.xml bll1992.pdf'
      - ask: 'mdls -p out.xml bll1992.pdf'

  # -j/--js runs the given file as JavaScript via JavaScriptCore, which sips
  # links (otool -L). Every other flag is an image query or transform. Output
  # goes to --out, or overwrites the input in place when --out is omitted.
  - allow: 'sips !-j|--js *'
    tests:
      - allow: 'sips -z 300 600 adding-tag.png --out adding-tag-zoom.png'
      - allow: 'sips -g pixelWidth -g pixelHeight IncomingOnly.png'
      - allow: 'sips -s description "x" screenshot.png'
      - ask: 'sips -j evil.js screenshot.png'
      - ask: 'sips -z 300 600 in.png --out out.png -j evil.js'
