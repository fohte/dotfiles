# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/runok/main/schema/runok.schema.json

extends:
  - 'github:fohte/runok-presets/base'
  - './common.yml'
  - './trusted-repos.yml'
  - './git.yml'
  - './macos.yml'
  - './opensrc.yml'
  - './languages/rust.yml'
  - './languages/go.yml'
  - './languages/node.yml'
  - './languages/ruby.yml'
  - './languages/python.yml'
  - './languages/jsonnet.yml'
  - './languages/perl.yml'
  - './tools/argocd.yml'
  - './tools/aws.yml'
  - './tools/colima.yml'
  - './tools/crit.yml'
  - './tools/docker.yml'
  - './tools/gcloud.yml'
  - './tools/imagemagick.yml'
  - './tools/infractl.yml'
  - './tools/k8s.yml'
  - './tools/linters.yml'
  - './tools/obsidian.yml'
  - './tools/pdf.yml'
  - './tools/srt.yml'
  - './tools/terraform.yml'
  - './tools/tq.yml'
  - './tools/wrangler.yml'
  - './tools/misc.yml'
  - './work.yml'

experimental:
  require_command_in_path:
    enabled: true

definitions:
  vars:
    # Bundled skill scripts are trusted executable resources managed alongside
    # their skill instructions, regardless of which repository is the cwd.
    # A pattern var compares the token as written, so every spelling a script
    # is invoked with needs its own entry; anything else falls through to the
    # generic rules.
    claude-skill-scripts:
      type: pattern
      values:
        - '~/.agents/skills/*/scripts/*'
        - '~/.agents/skills/*/bin/*'
        - '~/.claude/plugins/cache/*/*/*/skills/*/scripts/*'
        - '~/.claude/plugins/cache/*/*/*/skills/*/bin/*'
        # Plugin skills are usually invoked with a resolved absolute path. The
        # leading `/` keeps a cwd-relative `foo/.claude/plugins/cache/...` from
        # posing as a trusted script.
        - '/*/.claude/plugins/cache/*/*/*/skills/*/scripts/*'
        - '/*/.claude/plugins/cache/*/*/*/skills/*/bin/*'

    # These malformed script paths can still match the broad patterns above
    # because `*` also consumes `/`.
    untrusted-claude-skill-scripts:
      type: pattern
      values:
        - '~/.agents/skills/*..*/scripts/*|~/.agents/skills/*..*/bin/*'
        - '~/.agents/skills/*/scripts/*..*|~/.agents/skills/*/bin/*..*'
        - '~/.agents/skills/*/./*scripts/*|~/.agents/skills/*/./*bin/*'
        - '~/.agents/skills/*/scripts/./*|~/.agents/skills/*/bin/./*'
        - '~/.agents/skills/*/scripts/*/./*|~/.agents/skills/*/bin/*/./*'
        - '~/.agents/skills/*//*scripts/*|~/.agents/skills/*//*bin/*'
        - '~/.agents/skills/*/scripts//*|~/.agents/skills/*/bin//*'
        - '~/.agents/skills/*/scripts/*//*|~/.agents/skills/*/bin/*//*'
        - '~/.agents/skills/synced/scripts/*|~/.agents/skills/synced/bin/*'
        - '~/.agents/skills/*/*/scripts/*|~/.agents/skills/*/*/bin/*'
        - '~/.claude/plugins/cache/*..*skills/*/scripts/*|~/.claude/plugins/cache/*..*skills/*/bin/*'
        - '~/.claude/plugins/cache/*/skills/*..*/scripts/*|~/.claude/plugins/cache/*/skills/*..*/bin/*'
        - '~/.claude/plugins/cache/*/skills/*/scripts/*..*|~/.claude/plugins/cache/*/skills/*/bin/*..*'
        - '~/.claude/plugins/cache/*/./*skills/*/scripts/*|~/.claude/plugins/cache/*/./*skills/*/bin/*'
        - '~/.claude/plugins/cache/*/skills/*/./*scripts/*|~/.claude/plugins/cache/*/skills/*/./*bin/*'
        - '~/.claude/plugins/cache/*/skills/*/scripts/./*|~/.claude/plugins/cache/*/skills/*/bin/./*'
        - '~/.claude/plugins/cache/*/skills/*/scripts/*/./*|~/.claude/plugins/cache/*/skills/*/bin/*/./*'
        - '~/.claude/plugins/cache/*//*skills/*/scripts/*|~/.claude/plugins/cache/*//*skills/*/bin/*'
        - '~/.claude/plugins/cache/*/skills/*//*scripts/*|~/.claude/plugins/cache/*/skills/*//*bin/*'
        - '~/.claude/plugins/cache/*/skills/*/scripts//*|~/.claude/plugins/cache/*/skills/*/bin//*'
        - '~/.claude/plugins/cache/*/skills/*/scripts/*//*|~/.claude/plugins/cache/*/skills/*/bin/*//*'
        - '~/.claude/plugins/cache/*/*/*/*/skills/*/scripts/*|~/.claude/plugins/cache/*/*/*/*/skills/*/bin/*'
        - '~/.claude/plugins/cache/*/*/*/skills/*/*/scripts/*|~/.claude/plugins/cache/*/*/*/skills/*/*/bin/*'
        - '~/.claude/plugins/cache/*/*/*/skills/synced/scripts/*|~/.claude/plugins/cache/*/*/*/skills/synced/bin/*'
        - '/*..*/.claude/plugins/cache/*/*/*/skills/*/scripts/*|/*..*/.claude/plugins/cache/*/*/*/skills/*/bin/*'
        - '/*/./*/.claude/plugins/cache/*/*/*/skills/*/scripts/*|/*/./*/.claude/plugins/cache/*/*/*/skills/*/bin/*'
        - '/*//*/*.claude/plugins/cache/*/*/*/skills/*/scripts/*|/*//*/*.claude/plugins/cache/*/*/*/skills/*/bin/*'
        - '/*/.claude/plugins/cache/*..*skills/*/scripts/*|/*/.claude/plugins/cache/*..*skills/*/bin/*'
        - '/*/.claude/plugins/cache/*/skills/*..*/scripts/*|/*/.claude/plugins/cache/*/skills/*..*/bin/*'
        - '/*/.claude/plugins/cache/*/skills/*/scripts/*..*|/*/.claude/plugins/cache/*/skills/*/bin/*..*'
        - '/*/.claude/plugins/cache/*/./*skills/*/scripts/*|/*/.claude/plugins/cache/*/./*skills/*/bin/*'
        - '/*/.claude/plugins/cache/*/skills/*/./*scripts/*|/*/.claude/plugins/cache/*/skills/*/./*bin/*'
        - '/*/.claude/plugins/cache/*/skills/*/scripts/./*|/*/.claude/plugins/cache/*/skills/*/bin/./*'
        - '/*/.claude/plugins/cache/*/skills/*/scripts/*/./*|/*/.claude/plugins/cache/*/skills/*/bin/*/./*'
        - '/*/.claude/plugins/cache/*//*skills/*/scripts/*|/*/.claude/plugins/cache/*//*skills/*/bin/*'
        - '/*/.claude/plugins/cache/*/skills/*//*scripts/*|/*/.claude/plugins/cache/*/skills/*//*bin/*'
        - '/*/.claude/plugins/cache/*/skills/*/scripts//*|/*/.claude/plugins/cache/*/skills/*/bin//*'
        - '/*/.claude/plugins/cache/*/skills/*/scripts/*//*|/*/.claude/plugins/cache/*/skills/*/bin/*//*'
        - '/*/.claude/plugins/cache/*/*/*/*/skills/*/scripts/*|/*/.claude/plugins/cache/*/*/*/*/skills/*/bin/*'
        - '/*/.claude/plugins/cache/*/*/*/skills/*/*/scripts/*|/*/.claude/plugins/cache/*/*/*/skills/*/*/bin/*'
        - '/*/.claude/plugins/cache/*/*/*/skills/synced/scripts/*|/*/.claude/plugins/cache/*/*/*/skills/synced/bin/*'

    # Interpreter sandboxes need temp-file access for bundled tools without
    # broadening the separate shell and direct-execution trust set.
    sandboxed-skill-scripts:
      type: pattern
      values:
        - '~/.agents/skills/*/scripts/*'
        - '~/.agents/skills/*/bin/*'
        - '~/.claude/skills/*/scripts/*'
        - '~/.claude/skills/*/bin/*'
        - '/*/.agents/skills/*/scripts/*'
        - '/*/.agents/skills/*/bin/*'
        - '/*/.claude/skills/*/scripts/*'
        - '/*/.claude/skills/*/bin/*'
        - '~/.claude/plugins/cache/*/*/*/skills/*/scripts/*'
        - '~/.claude/plugins/cache/*/*/*/skills/*/bin/*'
        - '/*/.claude/plugins/cache/*/*/*/skills/*/scripts/*'
        - '/*/.claude/plugins/cache/*/*/*/skills/*/bin/*'

  paths:
    sensitive:
      - '.env'
      - '.env.*'
      - '.envrc'
      - '~/.ssh/**'
      - '~/.gnupg/**'
      - '~/.aws/credentials'
      - '~/.aws/sso/**'
      - '~/.config/gh/hosts.yml'

  sandbox:
    readonly:
      fs:
        write:
          allow: []
          deny:
            - '<path:sensitive>'
      network:
        allow: false

    # For interpreters whose in-place edit mode (e.g. `perl -i`) needs real
    # writes, unlike `readonly` above. Writes are confined to the project
    # tree (excluding `.git`), so damage stays recoverable via git, and
    # network is blocked. Only `<path:sensitive>` is read-denied -- runok's
    # fs.read only supports deny-listing, not scoping reads to cwd, so other
    # paths on disk (e.g. ~/.aws/config, ~/.npmrc) remain readable.
    write-cwd:
      fs:
        read:
          deny:
            - '<path:sensitive>'
        write:
          allow:
            - '.'
          deny:
            - '.git'
            - '<path:sensitive>'
      network:
        allow: false

    # For tools that create real temp files (e.g. `mkdtemp`) and write their
    # output next to the cwd. `fs.write.allow` takes literal existing
    # directories only -- neither `$TMPDIR` nor a glob is expanded -- so the
    # macOS temp root `$TMPDIR` points into is listed whole as `/var/folders`.
    write-tmp-cwd:
      fs:
        read:
          deny:
            - '<path:sensitive>'
        write:
          allow:
            - '.'
            - '/tmp'
            - '/var/folders'
          deny:
            - '.git'
            - '<path:sensitive>'
      network:
        allow: false

  wrappers:
    # `*` consumes 0+ TOOL@VERSION args so both `mise x -- <cmd>` and
    # `mise x jq node@20 -- <cmd>` route through the wrapper.
    - 'mise x|exec * -- <cmd>'
    - 'rtk proxy <cmd>'

rules:
  # No sandbox: bundled scripts spawn agents and reach the network.
  # Direct command paths aren't available in `when`, so malformed spellings
  # need a more-specific decision than the broad allow patterns.
  - ask: '<var:untrusted-claude-skill-scripts> *'
    tests:
      - ask: '~/.agents/skills/x/../../tmp/scripts/evil.sh'
      - ask: '~/.agents/skills/self-review/./scripts/evil.sh'
      - ask: '~/.agents/skills/self-review//scripts/evil.sh'
      - ask: '~/.agents/skills/self-review/scripts/./evil.sh'
      - ask: '~/.agents/skills/self-review/scripts//evil.sh'
      - ask: '~/.agents/skills/synced/self-review/scripts/evil.sh'
      - ask: '~/.agents/skills/synced/scripts/evil.sh'
      - pass: '~/.claude/skills/synced/example-skill/scripts/check.cjs'
      - ask: '~/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/nested/scripts/evil.sh'
      - deny: '/Users/foo/../bar/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/evil.sh'
      - deny: '/Users/foo/./bar/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/evil.sh'
      - deny: '/Users/foo//bar/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/evil.sh'

  - ask: 'bash <var:untrusted-claude-skill-scripts> *'
    tests:
      - ask: 'bash ~/.agents/skills/x/../../tmp/scripts/evil.sh'
      - ask: 'bash ~/.agents/skills/self-review/./scripts/evil.sh'
      - ask: 'bash ~/.agents/skills/self-review//scripts/evil.sh'
      - ask: 'bash ~/.agents/skills/self-review/scripts/./evil.sh'
      - ask: 'bash ~/.agents/skills/self-review/scripts//evil.sh'
      - ask: 'bash ~/.agents/skills/synced/self-review/scripts/evil.sh'
      - ask: 'bash ~/.agents/skills/synced/scripts/evil.sh'
      - pass: 'bash ~/.claude/skills/synced/example-skill/scripts/check.cjs'
      - ask: 'bash ~/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/nested/scripts/evil.sh'
      - ask: 'bash ~/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/../evil.sh'
      - ask: 'bash ~/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/./evil.sh'
      - ask: 'bash ~/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts//evil.sh'
      - ask: 'bash /Users/foo/../bar/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/evil.sh'
      - ask: 'bash /Users/foo/./bar/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/evil.sh'
      - ask: 'bash /Users/foo//bar/.claude/plugins/cache/market/plugin/1.0.0/skills/sample/scripts/evil.sh'

  - allow: 'bash <var:claude-skill-scripts>'
    when: &trusted_claude_skill_script >-
      size(args) > 0 &&
      !args[0].contains('..') &&
      !args[0].contains('//') &&
      !args[0].matches('^~/.*/[.]/') &&
      !args[0].matches('^/.*/[.]/') &&
      (
        (args[0].matches('^~/[.]agents/skills/[^/]+/(scripts|bin)/') &&
          !args[0].matches('^~/[.]agents/skills/synced/')) ||
        args[0].matches('^~/[.]claude/plugins/cache/[^/]+/[^/]+/[^/]+/skills/[^/]+/(scripts|bin)/') ||
        args[0].matches('^/[A-Za-z0-9._ /-]+/[.]claude/plugins/cache/[^/]+/[^/]+/[^/]+/skills/[^/]+/(scripts|bin)/')
      )
    tests:
      - allow: 'bash ~/.agents/skills/self-review/scripts/select-reviewers'
      - allow: 'bash /Users/foo/.claude/plugins/cache/some-marketplace/some-plugin/1.0.0/skills/some-skill/scripts/check.cjs'
      - pass: 'bash ~/.claude/skills/delegate/scripts/launch --task task.yaml --label example'
      - pass: 'bash ~/.claude/skills/synced/example-skill/scripts/check.cjs'
      - pass: 'bash $HOME/.agents/skills/delegate/scripts/launch --task task.yaml --label example'

  - allow: 'bash <var:claude-skill-scripts> *'
    when: *trusted_claude_skill_script
    tests:
      - allow: 'bash ~/.agents/skills/self-review/scripts/run-external-reviewers /tmp/manifest.json'
      - allow: 'bash /Users/foo/.claude/plugins/cache/some-marketplace/some-plugin/1.0.0/skills/some-skill/scripts/check.cjs out.md'
      - pass: 'bash ~/.claude/skills/delegate/scripts/launch --task task.yaml --label example'
      - pass: 'bash ~/.claude/skills/synced/example-skill/scripts/check.cjs'
      - pass: 'bash $HOME/.agents/skills/delegate/scripts/launch --task task.yaml --label example'

  # Absolute-path forms of <var:claude-skill-scripts> aren't tested here: bare
  # execution of an absolute path always loses to the `deny: '/* *'` rule
  # below (Explicit Deny Wins), regardless of this rule's own match.
  - allow: '<var:claude-skill-scripts>'
    tests:
      - allow: '~/.agents/skills/self-review/scripts/select-reviewers'
      - allow: '~/.claude/plugins/cache/some-marketplace/some-plugin/1.0.0/skills/some-skill/scripts/check.cjs'
      - pass: '~/.claude/skills/delegate/scripts/launch --task task.yaml --label example'
      - pass: '~/.claude/skills/synced/example-skill/scripts/check.cjs'
      - pass: '$HOME/.agents/skills/delegate/scripts/launch --task task.yaml --label example'

  - allow: '<var:claude-skill-scripts> *'
    tests:
      - allow: '~/.agents/skills/self-review/scripts/run-external-reviewers /tmp/manifest.json'
      - allow: '~/.claude/plugins/cache/some-marketplace/some-plugin/1.0.0/skills/some-skill/scripts/check.cjs out.md'
      - pass: '~/.claude/skills/delegate/scripts/launch --task task.yaml --label example'
      - pass: '~/.claude/skills/synced/example-skill/scripts/check.cjs'
      - pass: '$HOME/.agents/skills/delegate/scripts/launch --task task.yaml --label example'

  - ask: '~/.agents/skills/delegate/scripts/launch *'
    when: '!has(flags.vibe) && !("dry-run" in flags) && !has(flags.help) && !has(flags.h)'
    tests:
      - ask: '~/.agents/skills/delegate/scripts/launch --task task.yaml --label example'
      - allow: '~/.agents/skills/delegate/scripts/launch --vibe --task task.yaml --label example'
      - allow: '~/.agents/skills/delegate/scripts/launch --task task.yaml --label example --dry-run'
      - allow: '~/.agents/skills/delegate/scripts/launch --help'
      - allow: '~/.agents/skills/delegate/scripts/launch -h'

  - ask: 'bash ~/.agents/skills/delegate/scripts/launch *'
    when: '!has(flags.vibe) && !("dry-run" in flags) && !has(flags.help) && !has(flags.h)'
    tests:
      - ask: 'bash ~/.agents/skills/delegate/scripts/launch --task task.yaml --label example'
      - allow: 'bash ~/.agents/skills/delegate/scripts/launch --vibe --task task.yaml --label example'
      - allow: 'bash ~/.agents/skills/delegate/scripts/launch --task task.yaml --label example --dry-run'
      - allow: 'bash ~/.agents/skills/delegate/scripts/launch --help'
      - allow: 'bash ~/.agents/skills/delegate/scripts/launch -h'

  - allow: '~/.agents/skills/handoff/scripts/launch *'
    tests:
      - allow: '~/.agents/skills/handoff/scripts/launch --handoff handoff.md --label example'
      - allow: 'bash ~/.agents/skills/handoff/scripts/launch --handoff handoff.md --label example'

  # `rtk <cmd>` strips boilerplate from the inner command's stdout. Any other
  # rtk subcommand should go through `rtk proxy <cmd>`, which is registered
  # as a wrapper above so the inner command is evaluated against normal rules.
  - deny: 'rtk !proxy *'
    message: 'Bare `rtk <cmd>` truncates output. Use `rtk proxy <cmd>` so the inner command is evaluated by runok rules.'
    fix_suggestion: 'rtk proxy <cmd>'
    tests:
      - deny: 'rtk git diff'
      - deny: 'rtk ls /tmp'

  # Absolute-path invocation makes existing rule patterns (e.g. `rg *`) miss
  # and skips PATH-based wrappers. Call the command by its bare name; if
  # output truncation is a real problem, wrap it with `rtk proxy <cmd>`.
  - deny: '/* *'
    message: 'Absolute paths are denied so they cannot bypass rules and wrappers keyed on command names; this is not a ban on the command itself. For a command on PATH, call it by its bare name (e.g. `rg`), and use `rtk proxy <cmd>` only when you need untruncated output. For a script not on PATH (e.g. a skill script), keep the `~/...` form exactly as the instructions wrote it instead of expanding `~`.'
    tests:
      - deny: '/opt/homebrew/bin/rg foo'
      - deny: '/usr/bin/ls'
      - deny: '/bin/sh -c "echo hi"'

tests:
  cases:
    - allow: 'mise x -- ls /tmp'
    - allow: 'mise exec -- ls /tmp'
    - allow: 'mise x jq -- ls /tmp'
    - allow: 'mise exec jq -- ls /tmp'
    - allow: 'mise x node@20 -- ls /tmp'
    - allow: 'mise x node@20 python@3.11 -- ls /tmp'
    - allow: 'rtk proxy ls /tmp'
    - allow: 'rtk proxy git status'
