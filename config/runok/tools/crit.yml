# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/runok/main/schema/runok.schema.json

rules:
  - allow: 'crit *'
    tests:
      - allow: 'crit'
      - allow: 'crit plan.md'
      - allow: 'crit --pr 123'
      - allow: 'crit --range main..HEAD'
      - allow: 'crit comment --author "Claude Code" foo.md:5 body'
      - allow: 'crit comments --json'
      - allow: 'crit status'
      - allow: 'crit pull 123'
      - allow: 'crit plan-hook'

  # Uploads review content to crit's hosted service and prints a public
  # (or org-scoped) URL -- never publish outside the local machine unattended.
  #
  # `share`/`unpublish`/`push` are only dispatched as subcommands when they
  # are args[0] (see dispatchWithRegistry in crit's cli_dispatch.go); a
  # leading global flag like `--port 8080` makes crit fall through to the
  # bare-review path instead, so no `<opts>`/`*` prefix is needed here.
  - deny: 'crit share *'
    message: 'crit share is disabled globally via ~/.crit.config.json (share_url=""), so this would not publish even if run yourself.'
    tests:
      - deny: 'crit share plan.md'
      - allow: 'crit comment file.md:5 share'
  - deny: 'crit unpublish *'
    message: 'Paired with crit share, which is also disabled globally (see crit share message).'
    tests:
      - deny: 'crit unpublish plan.md'

  # Kills every crit daemon on the machine, including ones owned by other
  # Claude Code sessions.
  - deny: 'crit stop --all *'
    message: 'crit stop --all kills daemons of other sessions too.'
    fix_suggestion: 'Run `crit stop` (current session) or `crit stop <file>` instead.'
    tests:
      - deny: 'crit stop --all'
      - deny: 'crit stop plan.md --all'
      - allow: 'crit stop'
      - allow: 'crit stop plan.md'

  # Review forms block until the human finishes, and Codex can only wait for
  # that by polling. Codex exports CODEX_SESSION_ID to `runok exec`, not to
  # the hook process, so this is enforced at exec time.
  # Inline tests cannot set env: verify with `CODEX_SESSION_ID=x runok check`
  # that `crit` is denied and `a agent bg run -- crit` is allowed, and run
  # `runok test` without CODEX_SESSION_ID or the review-form allow tests above
  # fail.
  - deny: 'crit *'
    when: >-
      'CODEX_SESSION_ID' in env
      && !shell.wrappers.exists(w, w == 'a cc|agent bg run -- <cmd>')
      && !has(flags.help) && !has(flags.h) && !has(flags.version) && !has(flags.v)
      && (size(args) == 0 || !(args[0] in [
      'comment', 'comments', 'share', 'fetch', 'unpublish', 'install',
      'config', 'check', 'pull', 'push', 'status', 'stop', 'cleanup', 'stats',
      'auth', 'story', 'plan-hook']))
    message: >-
      Do not run blocking crit review commands directly. Run
      `a agent bg run -- <this crit command>` and end your turn without
      polling; you will be resumed with a <background-task-complete> message
      when the review is finished, however long it takes.
    fix_suggestion: 'a agent bg run -- crit ...'

    tests:
      - allow: 'a agent bg run -- crit'
      - allow: 'a cc bg run -- crit --pr 123'
      - deny: 'a agent bg run -- crit share plan.md'
      - ask: 'a agent bg run -- crit push 123'

  # Posts review comments to a GitHub PR, visible to other collaborators.
  - ask: 'crit push *'
    tests:
      - ask: 'crit push --dry-run'
      - ask: 'crit push 123'
      - allow: 'crit comment --author push foo.md:5 body'
