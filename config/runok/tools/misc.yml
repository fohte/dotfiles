# yaml-language-server: $schema=https://raw.githubusercontent.com/fohte/runok/main/schema/runok.schema.json

definitions:
  aliases:
    # devDependency-only repos have no local lefthook binary; nlx dlx-runs
    # the npm package of the same name instead.
    lefthook:
      - lefthook
      - nlx lefthook

    # marp-cli ships a `marp` bin, so it runs either under that short name (a
    # local/global binary, or `nlx` resolving the local devDependency's bin) or
    # under the scoped package name that `nlx` dlx-runs when nothing is
    # installed locally.
    marp:
      - marp
      - nlx marp
      - nlx @marp-team/marp-cli
      - nlx @marp-team/marp-cli@*

  wrappers:
    # Treat `nlx --package <pkg> -c '<shell-string>'` as a wrapper so the
    # shell string inside the quotes is recursively evaluated against the
    # normal rules. Without this, the quoted token is opaque and a single
    # glob in the allow pattern would swallow arbitrary shell metacharacters
    # (e.g. `;`, `&&`), turning the rule into an RCE.
    - 'nlx --package * -c <cmd>'
    # Bare form: `nlx -p|--package <pkg> [--prefer-online] <inner-cmd> ...`.
    # No `-c`, so the inner command is parsed as tokens (not a shell string)
    # and recursively evaluated against the normal rules.
    - 'nlx -p|--package * [--prefer-online] <cmd>'

rules:
  # armyknife
  - allow: 'a ai draft *'
  - allow: 'a ai pr-draft *'
  - allow: 'a ai review wait *'
  - deny: 'a ai review request *'
    message: 'AI review requests cost money and must not be run casually.'
    tests:
      - deny: 'a ai review request'
      - deny: 'a ai review request 123'
  - allow: 'a gh check-pr-review *'
  - allow: 'a gh pr-review check *'
  - allow: 'a gh pr-review reply pull *'
  - allow: 'a gh pr-review reply push *'
  - allow: 'a gh pr-review reply review *'
  - allow: 'a gh issue-agent init|diff|pull|view|review *'
  - allow: 'a gh issue-agent push !--force !--allow-delete *'
    tests:
      - allow: a gh issue-agent push 123
      - ask: a gh issue-agent push --force 123
      - ask: a gh issue-agent push --allow-delete 123

  # Claude Code
  - allow: 'claude-session-digest *'
  - allow: 'gen-claude-template *'

  # skills CLI (used by /find-skills)
  - allow: 'nlx skills find|view|check|update|init *'
    tests:
      - allow: 'nlx skills find skill-creator'
      - allow: 'nlx skills find "github actions"'
      - allow: 'nlx skills view anthropics/skills@skill-creator'
      - allow: 'nlx skills check'
      - allow: 'nlx skills update'
      - allow: 'nlx skills init my-skill'
  - allow: 'nlx skills add *'
    tests:
      - allow: 'nlx skills add getsentry/skills@gha-security-review -g -y'
      - allow: 'nlx skills add anthropics/skills@frontend-design'

  # semgrep
  - allow: 'sg|ast-grep scan|test|run *'

  # workflow tools
  - allow: 'lefthook run *'
    tests:
      - allow: 'lefthook run pre-commit'
      - allow: 'nlx lefthook run pre-commit'
  - allow: 'lefthook validate|version|dump'
    tests:
      - allow: 'lefthook validate'
      - allow: 'lefthook version'
      - allow: 'lefthook dump'
      - allow: 'nlx lefthook validate'

  # tmux (read-only)
  - allow: 'tmux -V'
  - allow: 'tmux capture-pane *'
  - allow: 'tmux display|display-message *'
    tests:
      - allow: 'tmux display-message hello'
      - allow: 'tmux display -p -t %0 "#{pane_id}"'
      - allow: 'tmux display -p "x"'
  - allow: 'tmux list-*|show-* *'
    tests:
      - allow: 'tmux list-sessions'
      - allow: 'tmux show-options'

  # runok
  - allow: 'runok [-c *] check *'
  - allow: 'runok exec *'

  # `--engine <file.js>` loads a JS module as the converter, `--config` (`-c` /
  # `--config-file`) points at a config file that may define `engine` as a JS
  # function, and `--browser-path` runs an arbitrary executable -- all three are
  # negated so they fall through to the default ask.
  - allow: 'marp !--engine !-c !--config !--config-file !--browser-path *'
    tests:
      - allow: 'marp slides.md -o slides.html'
      - ask: 'marp --engine ./evil.js slides.md'
      - ask: 'marp --engine=./evil.js slides.md'
      - ask: 'marp -c ./marp.config.js slides.md'
      - ask: 'marp --config ./marp.config.js slides.md'
      - ask: 'marp --config-file ./marp.config.js slides.md'
      - ask: 'marp --browser-path /tmp/evil slides.md'
      - ask: 'nlx @marp-team/marp-cli@latest --engine ./evil.js slides.md'
      - allow: 'nlx marp slides.md --pdf'
      - allow: 'nlx @marp-team/marp-cli slides.md --images png'
      - allow: 'nlx @marp-team/marp-cli@latest slides.md -o out/slides.html'
      - allow: 'nlx @marp-team/marp-cli@4.2.3 slides.md'
      - allow: 'nlx -p @marp-team/marp-cli marp slides.md'

  # opensrc (read-only and idempotent fetch). remove/clean fall through to default ask.
  - allow: 'opensrc path|list|fetch *'
    tests:
      - allow: 'opensrc path zod'
      - allow: 'opensrc path zod@3.22.0'
      - allow: 'opensrc list'
      - allow: 'opensrc fetch react'
      - ask: 'opensrc remove zod'
      - ask: 'opensrc clean'

  - allow: pinact run *

  - allow: mise ls|list|where|which *
    tests:
      - allow: 'mise ls'
      - allow: 'mise list aqua'
  - allow: mise config get *
  - allow: 'mise config'
    tests:
      - allow: 'mise config'
  - allow: 'mise config ls'
    tests:
      - allow: 'mise config ls'
  - allow: 'mise doctor'
    tests:
      - allow: 'mise doctor'
  - allow: 'mise trust --show'
    tests:
      - allow: 'mise trust --show'
  - allow: 'mise reshim *'
    tests:
      - allow: 'mise reshim'
      - allow: 'mise reshim -v'
      - allow: 'mise reshim -f'
  - allow: 'mise activate zsh'
    tests:
      - allow: 'mise activate zsh'
  - allow: 'mise tasks'
    tests:
      - allow: 'mise tasks'
  - allow: 'mise settings get *'
    tests:
      - allow: 'mise settings get trusted_config_paths'
      - allow: 'mise settings get disable_tools'
      - allow: 'mise settings get'
  - allow: 'mise prune *'
    tests:
      - allow: 'mise prune -y'
      - allow: 'mise prune --dry-run'
  - allow: 'mise hook-env *'
    tests:
      - allow: 'mise hook-env -s zsh'
  - allow: 'mise help *'
    tests:
      - allow: 'mise help hook-env'
  - allow: 'mise'
    tests:
      - allow: 'mise'

  # basefmt (fohte's own EditorConfig-based formatter, github:fohte/basefmt),
  # run via `mise x "github:fohte/basefmt" -- basefmt <files>`.
  - allow: 'basefmt *'
    tests:
      - allow: 'basefmt scripts/db-up .mise.toml README.md'

  # betterleaks (secret scanner). The dangerous flags (report-path/template,
  # config, diagnostics) are deliberately left out of the pattern rather than
  # negated, so nothing outside the enumerated optional flags matches.
  - allow: 'betterleaks git --pre-commit --staged [--redact] [--verbose] [--no-banner]'
    tests:
      - allow: 'betterleaks git --pre-commit --staged --verbose --no-banner'
      - allow: 'betterleaks git --pre-commit --redact --staged --verbose'
      - allow: 'betterleaks git --pre-commit --staged'
      - ask: 'betterleaks git --pre-commit --staged --report-path /tmp/out.json'
      - ask: 'betterleaks git --pre-commit --staged /Users/fohte/other-repo'

  - allow: conftest verify *
  - allow: conftest test *

  # Renovate (debug-renovate skill).
  # `nlx --package renovate -c '<cmd>'` is routed through the
  # `nlx --package * -c <cmd>` wrapper above, so the shell string inside the
  # quotes is recursively evaluated as a normal command.
  - allow: 'renovate-dryrun *'
    tests:
      - allow: 'renovate-dryrun'
      - allow: 'renovate-dryrun --branch feature/x'
      - allow: 'renovate-dryrun --raw'
  - allow: 'renovate-config-validator *'
    tests:
      - allow: 'renovate-config-validator renovate.json5'
      - allow: "nlx --package renovate -c 'renovate-config-validator renovate.json5'"
      - allow: 'nlx -p renovate renovate-config-validator renovate.json5'
      - allow: 'nlx -p renovate --prefer-online renovate-config-validator renovate.json5'
      # Wrapper expands the quoted shell string, so command injection in `-c`
      # falls through to the `rm -rf *` deny rule in common.yml.
      - deny: "nlx --package renovate -c 'rm -rf /'"
      - deny: "nlx --package renovate -c 'renovate-config-validator renovate.json5; rm -rf /'"

  # `--plugin name=path` and `--exec-pipe -- <cmd>` run arbitrary commands, so
  # this can't be scoped down by flags alone. `readonly` (see runok.yml) denies
  # every write and all network, which rendering never needs: there is no
  # `exec.*` template namespace, every datasource scheme is read-only, and
  # output goes to stdout. `-o <file>` and `--output-dir` are denied as a
  # result -- redirect instead.
  - allow: 'gomplate *'
    sandbox: readonly
    tests:
      - allow: 'gomplate -f -'
      - allow: 'gomplate -d vars=stdin:///vars.json -f -'
      - allow: 'gomplate -d vars=stdin:///vars.json -f config/claude/contexts/skill/create-pr/template.md'
      # Arbitrary-exec flags stay allowed by the pattern on purpose; the
      # sandbox is what contains them.
      - allow: 'gomplate -i hello --exec-pipe -- cat'

  - deny: opencode *
    message: don't use opencode
